<!DOCTYPE html>
<html>
<head>
    <title>Uncle Bro's</title>
    <link rel="stylesheet" href="style.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: rgb(73, 73, 73);
            display: flex;
            justify-content: center;
            align-items: center;
             background-color: whitesmoke;
        }

        .login-box {
            width: 800px;
            padding: 35px;
            background-color: whitesmoke;
            color: black;
            text-align: center;
        }

        .login-box h1 {
            margin-bottom: 10px;
            color: black;
        }

      
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        button {
            width: 20%;
            padding: 12px;
            margin-top: 15px;
            background: #3b2417;
            color: white;
            margin: 8px 0;   
            border: none;
            cursor: pointer;
            float: left;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }


        .button-area span {
    color: #102e45;
    font-size: 14px;
}

        button:hover {
            background: #3b2417;
            transform: scale(1.10);
            
        }
    </style>
</head>

<body>

    <div class="login-box">
         <br>
        <br>
        <h2>CREATE ACCOUNT</h2>
        <br>

        <input type="text" placeholder="First Name">
        <input type="text" placeholder="Last Name">
        <input type="text" placeholder="Email">
        <input type="password" placeholder="Password">
         <input type="password" placeholder="Confirm Password">


        <a href="index.html"><button><b>CREATE</b></button></a>
        <a href="login.html"><button><b>RETURN</b></button></a> 
    </div> 
     

</body>
</html>
